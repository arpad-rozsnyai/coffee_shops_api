---
openapi: 3.0.1
info:
  title: Coffee Shops API
  version: v1
  description: Given a user's X/Y coordinates, returns the three nearest coffee shops
    from a remote CSV data source, ordered nearest to farthest.
paths:
  "/api/v1/coffee_shops":
    get:
      summary: Finds the three nearest coffee shops to a coordinate
      tags:
      - Coffee Shops
      description: Fetches coffee shop data from the configured CSV source and returns
        the three nearest shops to the given X/Y coordinate, ordered nearest to farthest,
        as a JSON:API document.
      parameters:
      - name: x
        in: query
        schema:
          type: number
          format: float
        required: true
        description: User's X coordinate
        example: 47.6
      - name: "y"
        in: query
        schema:
          type: number
          format: float
        required: true
        description: User's Y coordinate
        example: -122.4
      responses:
        '200':
          description: three nearest coffee shops, nearest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    minItems: 3
                    maxItems: 3
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Deterministic id derived from the shop's name/x/y
                          example: 3f2e1a0b9c8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f
                        type:
                          type: string
                          example: coffee_shops
                        attributes:
                          type: object
                          properties:
                            name:
                              type: string
                              example: Starbucks Seattle2
                            x:
                              type: number
                              example: 47.6109
                            "y":
                              type: number
                              example: -122.4
                            distance:
                              type: number
                              description: Rounded to 4 decimal places
                              example: 0.0109
                          required:
                          - name
                          - x
                          - "y"
                          - distance
                      required:
                      - id
                      - type
                      - attributes
                required:
                - data
        '400':
          description: x and/or y is missing or not a valid number
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        status:
                          type: string
                          example: '400'
                        title:
                          type: string
                          example: Invalid Parameter
                        detail:
                          type: string
                          example: is not a valid number
                        source:
                          type: object
                          properties:
                            parameter:
                              type: string
                              example: x
                          required:
                          - parameter
                      required:
                      - status
                      - title
                      - detail
                      - source
                required:
                - errors
        '503':
          description: the coffee shop CSV source is unavailable or unusable
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        status:
                          type: string
                          example: '503'
                        title:
                          type: string
                          example: Data Source Unavailable
                        detail:
                          type: string
                          example: Coffee shop data is temporarily unavailable.
                      required:
                      - status
                      - title
                      - detail
                required:
                - errors
